<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>火柴人(席子Σ(っ °Д °;)っ)跑步</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        body,
        html {
            width: 100%;
            height: 100%;
        }

        body {
            background-color: rgb(100, 94, 94);
        }

        .container {
            width: 300px;
            height: 300px;
            margin: 50px;
            position: relative;
        }

        .person {
            position: absolute;
            left: 150px;
            top: 160px;
            animation:personbob 5s infinite linear;
        }

        .head {
            width: 30px;
            height: 30px;
            position: absolute;
            left: -6px;
            top: -30px;
            border-radius: 50%;
            border: 10px solid rgb(255, 255, 255);
            animation: headbob 2s infinite alternate;
        }

        .torso {
            width: 0;
            height: 60px;
            border-left: 10px solid rgb(255, 255, 255);
            position: absolute;
            left: 0px;
            top: 15px;
        }

        .person .part {
            position: absolute;
            left: 0px;
            top: 75px;
        }

        .person .part.arm {
            width: 40px;
            height: 45px;
            border-left: 10px solid rgb(255, 255, 255);
            border-bottom: 10px solid rgb(255, 255, 255);
            position: absolute;
            top: 15px;
            right: 300px;
            transform-origin: 0% 0% 0px;
            animation: armbob 1s infinite ease-in-out;
        }

        .person .part.arm.left {
            transform: rotate3d(0, 0, 1, 80deg);
        }

        .person .part.arm.right {
            transform: rotate3d(0, 0, 1, -80deg);
            animation-delay: 0.5s;
        }

        .person .part.leg {
            position: absolute;
            left: 10px;
            width: 60px;
            height: 60px;
            border-right: 10px solid rgb(255, 255, 255);
            border-top: 10px solid rgb(255, 255, 255);
            transform-origin: 0% 0% 0px;
            animation: legbob 1s infinite ease-in-out;
        }

        .person .part.leg.left {
            transform: rotate3d(0, 0, 1, 100deg);
            animation-delay: 0.5s;
        }

        .person .part.leg.right {
            transform: rotate3d(0, 0, 1, 10deg);
        }

        /* 头部动画 */
        @keyframes headbob {
            0% {
                transform: rotate3d(0, 0, 1, 5deg);
            }

            25% {
                transform: rotate3d(0, 0, 1, -30deg) skew(15deg, 0deg);
            }

            50% {
                transform: rotate3d(0, 0, 1, 5deg);
            }

            75% {
                transform: rotate3d(0, 0, 1, -30deg) skew(15deg, 0deg);
            }

            100% {
                transform: rotate3d(0, 0, 1, 20deg) skew(-15deg, 0deg);
            }
        }

        /* 胳膊摆动 */
        @keyframes armbob {
            0% {
                transform: rotate3d(0, 0, 1, 80deg);
            }

            50% {
                transform: rotate3d(0, 0, 1, -70deg);
            }

            100% {
                transform: rotate3d(0, 0, 1, 80deg);
            }
        }

        /* 腿跑起来 */
        @keyframes legbob {
            0% {
                transform: rotate3d(0, 0, 1, -5deg);
            }

            50% {
                transform: rotate3d(0, 0, 1, 150deg);
            }

            100% {
                transform: rotate3d(0, 0, 1, -5deg);
            }
        }

        /* 人物动起来 */
        @keyframes personbob {
            0% {
                transform: translate(-400px, 0);
            }

            100% {
                transform: translate(1600px, 0);
            }
        }
    </style>
</head>

<body>
    <!-- 火柴人 -->
    <div class="container">
        <div class="person">
            <div class="head"></div>
            <div class="part arm left"></div>
            <div class="part arm right"></div>
            <div class="torso"></div>
            <div class="part leg left"></div>
            <div class="part leg right"></div>
        </div>
    </div>
</body>

</html>
