<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h3{
            text-align:center;
            text-decoration:underline;
        }
        .text{
            font-size:30px;
            text-align:center;
            text-transform:uppercase;
        }
        .text_1{
            text-indent:20px;
        }
        p{
            font-size:20px;
        }
    </style>
</head>
<body>
    <h3>这是一个文本</h3>
    <p class="text">hello world</p>
    <p class="text_1">不要以苦难为借口，不要自暴自弃。这世界是公平的，上帝关了一扇窗，但他同时会为你打开另一扇门。众生是平等的，只要你永不放下，只要你艰苦奋斗，总能够过上快乐的生活!还是伊索说的好：“如果你受苦了，感激生活，那是它给你的一份感觉;如果你受苦了，感激上帝，说明你还活着。"</p>
</body>
</html>
