<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display:flex;
            flex-direction:row;
            justify-content:flex-end;
            align-items:center;
            height:500px;
            width:500px;
            background-color:rgb(0, 255, 0);
        }
        .box1{
            height: 100px;
            background-color:rgb(255, 0, 0);
            flex:2;
        }
        .box2{
            height:100px;
            background-color:rgb(0, 0, 255);
            flex:2;
        }
        .box3{
            height:100px;
            background-color:rgb(255, 255, 0);
            flex:1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
    </div>
</body>
</html>
