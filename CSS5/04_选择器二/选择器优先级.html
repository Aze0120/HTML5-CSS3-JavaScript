<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            color:orange;
            font-size:20px;
        }
        .text{
            color:red;
            font-size:40px;
        }
        #change{
            color:blue;
            font-size:50px;
        }
        p{
            color:green;
            font-size:30px;
        }
    </style>
</head>
<body>
    <h3>全局选择器：*{}</h3>
    <h3>元素选择器：(标签名称)h3{}</h3>
    <h3>类选择器：(类名).text{}</h3>
    <h3>ID选择器：(ID名)#change{}</h3>
    <p style="color:black;font-size:60px" class="text" id="change">优先级</p>
    <p class="text" id="change">优先级</p>
    <p class="text">优先级</p>
    <p>优先级</p>
    <h1>优先级：内联选择器>ID选择器>类选择器>元素选择器>全局选择器</h1>
</body>
</html>
