<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5页面</title>
    <style>
        .header{
            width:100%;
            height:65px;
            background-color: rgb(255, 255, 255);
            position:fixed;
            top:0px;
            left:0px;
        }
        .nav{
            display:flex;
            width:100%;
            height:300px;
            background-color: rgb(0, 153, 255);
            position:absolute;
            top:65px;
            right:0px;
        }
        .header_box1{
            display: flex;
            align-items: center;
            width: 200px;
            height: 55px;
            margin-left: 60px;
            position:absolute;
        }
        .biao_box{
            width:50px;
            height: 55px;
            position: absolute;
        }
        .header_text{
            margin-left: 50px;
        }
        .biao{
            width: 35px;
            height: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header_box1">
            <div class="biao_box">
                <img class="biao" src="../CSS5/06_背景属性/素材（小版）.png">
            </div>
            <h3 class="header_text">HTML全栈教程</h3>
        </div>
    </div>
    <div class="nav"></div>
</body>
</html>
